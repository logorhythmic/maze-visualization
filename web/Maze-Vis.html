<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>SDL Application</title>
	<style>
		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			width: 100vw;
			height: 100vh;
			background-color: #0d0d11;
			color: #e0e0e0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
			user-select: none;
			-webkit-user-select: none;
		}

		#viewport-container {
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			position: relative;
		}

		/* Scales the SDL canvas to fit screen while retaining original aspect ratio */
		canvas.emscripten {
			border: 0px none;
			background-color: #000000;
			outline: none;
			max-width: 100%;
			max-height: 100%;
			object-fit: contain;
			box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
			/* Use 'pixelated' for low-res pixel art; omit for smooth vector rendering */
			/* image-rendering: pixelated; */
		}

		/* Minimalist Loading Overlay */
		#loader {
			position: absolute;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			pointer-events: none;
			transition: opacity 0.3s ease;
		}

		.spinner {
			width: 36px;
			height: 36px;
			border: 3px solid rgba(255, 255, 255, 0.1);
			border-top-color: #4f46e5;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		#status {
			margin-top: 14px;
			font-size: 13px;
			letter-spacing: 0.5px;
			color: #9ca3af;
		}
	</style>
</head>

<body>

	<div id="viewport-container">
		<!-- Right-click default menu disabled to keep mouse capture clean -->
		<canvas class="emscripten" id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

		<div id="loader">
			<div class="spinner" id="spinner"></div>
			<div id="status">Initializing...</div>
		</div>
	</div>

	<script type="text/javascript">
		var statusElement = document.getElementById('status');
		var loaderElement = document.getElementById('loader');

		var Module = {
			print: function (text) {
				if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
				console.log(text);
			},
			printErr: function (text) {
				if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
				console.error(text);
			},
			canvas: (function () {
				var canvas = document.getElementById('canvas');

				// Automatically give focus on click so SDL captures keyboard events right away
				window.addEventListener('click', function () {canvas.focus();});

				// Block browser scrolling when pressing space or arrow keys
				window.addEventListener('keydown', function (e) {
					if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
						e.preventDefault();
					}
				}, false);

				return canvas;
			})(),
			setStatus: function (text) {
				if (!Module.setStatus.last) Module.setStatus.last = {time: Date.now(), text: ''};
				if (text === Module.setStatus.last.text) return;

				var now = Date.now();
				if (now - Module.setStatus.last.time < 30) return; // Limit updates to avoid UI stutter
				Module.setStatus.last.time = now;
				Module.setStatus.last.text = text;

				if (text) {
					statusElement.innerHTML = text;
				} else {
					loaderElement.style.opacity = '0';
					setTimeout(function () {loaderElement.style.display = 'none';}, 300);
				}
			},
			totalDependencies: 0,
			monitorRunDependencies: function (left) {
				this.totalDependencies = Math.max(this.totalDependencies, left);
				Module.setStatus(left ? 'Loading asset packages... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
			}
		};

		Module.setStatus('Downloading runtime...');

		// Focus canvas as soon as window loads
		window.addEventListener('load', function () {
			document.getElementById('canvas').focus();
		});


	</script>

	{{{ SCRIPT }}}
</body>

</html>
